# Dependabot configuration (OSPS-VM-05.x direction).
# Pairs with GitHub → Settings → Code security → "Dependabot security updates".
# Weekly, low-noise: grouped minor/patch bumps, capped open PRs.
version: 2
updates:
  # Python — the pyobfus / pyobfus-mcp packaging deps declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions — keep CI/release actions patched (also supports SHA-pinning hygiene).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # VS Code extension (Node/npm).
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
