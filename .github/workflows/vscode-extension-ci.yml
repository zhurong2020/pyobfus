name: VSCode Extension CI

# Separate from ci.yml: the Node/TypeScript and Python toolchains here are
# fully disjoint, and path-filtering keeps this job off pure-Python PRs
# (and keeps ci.yml off pure-extension PRs). See docs/VSCODE_EXTENSION_PLAN.md.

on:
  push:
    branches: [main, develop]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension-ci.yml'

# Least privilege: lint / typecheck / headless tests only read the checkout.
# OSPS-AC-04.01.
permissions:
  contents: read

defaults:
  run:
    working-directory: vscode-extension

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (pinned 2026-08-04)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    name: Test (Extension Host, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (pinned 2026-08-04)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5 (pinned 2026-05-09)
        with:
          python-version: '3.12'

      - name: Install pyobfus (contract test target -- real CLI, not mocked)
        run: python -m pip install -e .
        working-directory: .

      - name: Install extension dependencies
        run: npm ci

      - name: Compile extension + tests
        run: npm run pretest

      - name: Run tests (headless via xvfb)
        # PYOBFUS_PYTHON_PATH pins the integration test to the exact
        # interpreter `pip install -e .` above targeted -- the Extension
        # Host subprocess @vscode/test-electron launches does not reliably
        # inherit setup-python's PATH modification for a bare `python3`
        # lookup (confirmed empirically 2026-08-04: pyobfus installed fine,
        # but the integration test still skipped, resolving a different
        # interpreter). See src/cli/locate.ts's module docstring.
        run: xvfb-run -a npm test
        env:
          PYOBFUS_PYTHON_PATH: ${{ env.pythonLocation }}/bin/python

  package-check:
    name: Package (vsce dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (pinned 2026-08-04)
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package (validates package.json/icon/manifest; does not publish)
        run: npx vsce package --no-dependencies
