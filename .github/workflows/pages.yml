# Publishes the landing page at https://zhurong2020.github.io/pyobfus/
#
# GitHub Pages used to build `docs/` with Jekyll while Read the Docs built the
# same directory with MkDocs. Two generators, one source, two public sites with
# the same content and different themes. Everything done to the MkDocs config
# was invisible here, because Jekyll never reads it.
#
# That mattered more than it looks: the README advertises this URL as the
# purchase page, so the page where money changes hands was an accidental
# by-product of the documentation build.
#
# So the two are now separated. Read the Docs owns the documentation; this
# workflow owns a single hand-written landing page under `landing/`, which
# depends on nothing and builds in seconds.

name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'landing/**'
      - 'llms.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment of the purchase page.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    # The README links straight to this anchor. Losing it would send buyers to
    # the top of the page with no idea what they were meant to find.
    - name: Check the purchase anchor the README points at still exists
      run: grep -q 'id="purchase-professional-edition"' landing/index.html

    # English is canonical for product facts. The Chinese page is deliberately
    # a small navigation shell, but both stable URLs and language links must
    # remain deployable together.
    - name: Check the bilingual entry points remain connected
      run: |
        test -f landing/zh-cn/index.html
        grep -q 'hreflang="zh-Hans"' landing/index.html
        grep -q 'hreflang="en"' landing/zh-cn/index.html
        grep -q 'id="professional"' landing/zh-cn/index.html
        grep -q 'README.zh-CN.md' landing/zh-cn/index.html
        grep -q 'pyobfus#minimal-example' landing/zh-cn/index.html

    # The project sitemap lists exactly the pages in this artifact. The domain
    # root's robots.txt belongs to another repository, so this file is found
    # through Search Console rather than a robots.txt Sitemap line.
    - name: Check the sitemap lists every HTML page and parses
      run: |
        python3 -c "import xml.dom.minidom as m; m.parse('landing/sitemap.xml')"
        # while-read, not for-in: the root page maps to an empty path, which
        # word splitting would silently drop.
        (cd landing && find . -name index.html) | sed 's|^\./||; s|index\.html$||' |
          while IFS= read -r page; do
            grep -q "<loc>https://zhurong2020.github.io/pyobfus/${page}</loc>" landing/sitemap.xml \
              || { echo "sitemap.xml is missing /pyobfus/${page}"; exit 1; }
          done

    # llms.txt has one source of truth. RTD ships the checked-in twin while
    # Pages receives the same bytes at deploy time.
    - name: Add the public Agent guide to the Pages artifact
      run: |
        test -s llms.txt
        cmp --silent llms.txt docs/llms.txt
        cp llms.txt landing/llms.txt

    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: landing
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
