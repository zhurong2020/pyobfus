name: CodeQL

# Static analysis security scanning for pyobfus + pyobfus-mcp.
# Findings appear under the repo's "Security" tab.
# Added 2026-05-09 as part of Socket supply-chain-security score push (P0.6).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '37 14 * * 3'  # weekly Wednesday 14:37 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09)

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0 (pinned 2026-09-20)
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0 (pinned 2026-09-20)
        with:
          category: "/language:python"
