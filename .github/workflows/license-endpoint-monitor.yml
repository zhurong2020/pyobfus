# Synthetic monitor for the production licence-verification endpoint.
#
# Pro activation was broken for every customer from roughly 2026-07-08 until
# 2026-09-12 and nobody noticed, because nothing watched it. A paying customer
# had to write in. This workflow is the watch.
#
# It probes with a nonexistent licence key through the real client code, so it
# has no side effects: no customer record is touched, no device slot is used,
# and no real licence key is needed in secrets. A failed scheduled run notifies
# the repository owner, which is the entire point.

name: License Endpoint Monitor

on:
  schedule:
    # 06:00 and 18:00 UTC. The outage it guards against lasted two months, so
    # twice a day is ample; the cost is two 30-second runs.
    - cron: '0 6,18 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    # Re-check whenever the request path itself changes. A release commit that
    # touches the licence client gets verified against production immediately.
    paths:
      - 'pyobfus_pro/license.py'
      - 'pyobfus_pro/fingerprint.py'
      - 'cloudflare-worker/src/index.js'
      - 'scripts/monitor_license_endpoint.py'
      - '.github/workflows/license-endpoint-monitor.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe production /api/verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.12'

    - name: Install pyobfus
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Probe the licence endpoint
      run: python scripts/monitor_license_endpoint.py
