name: Dependabot auto-merge

# Auto-merge Dependabot *patch* and *minor* updates once the required status
# checks pass. Major updates are intentionally left as review PRs (see
# .github/dependabot.yml ignores). Safe by construction: gated on the
# dependabot[bot] actor and it never checks out or runs PR code — it only reads
# PR metadata via the API and enables GitHub's native auto-merge, which then
# waits for the branch ruleset's required checks before merging.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
      - name: Enable auto-merge for patch/minor
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
