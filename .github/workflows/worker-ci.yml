name: Worker CI

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/worker-ci.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Worker regression tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0 (pinned 2026-08-04)
        with:
          node-version: '22'
      - name: Run offline Worker regressions
        run: node --test test/*.test.js
