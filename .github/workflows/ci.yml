name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/ -v --cov=pyobfus --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check code formatting with black
      run: |
        black --check pyobfus/ tests/

    - name: Lint with ruff
      run: |
        ruff check pyobfus/ tests/

    - name: Type check with mypy
      run: |
        mypy pyobfus/ --ignore-missing-imports
      continue-on-error: true  # Don't fail CI on type errors yet

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test CLI installation
      run: |
        pyobfus --version

    - name: Test single file obfuscation
      run: |
        pyobfus examples/simple.py -o test_output.py
        python test_output.py

    - name: Test directory obfuscation with config
      run: |
        pyobfus examples/multifile -o test_multifile --config examples/multifile/pyobfus.yaml -v

  mcp-sdk-latest:
    # Catches mcp SDK API drift against pyobfus-mcp (e.g. the FastMCP version=
    # kwarg removal that shipped silently in mcp 1.20+ and forced the 0.1.2
    # emergency release on 2026-05-07). Pins the floor at the version we
    # currently require; CI fails the day a future floor breaks _build_server().
    name: pyobfus-mcp build smoke test (latest mcp SDK)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install pyobfus-mcp + latest mcp SDK
      run: |
        python -m pip install --upgrade pip
        pip install -e ./pyobfus_mcp 'mcp>=1.20'
        pip show mcp | grep -E '^(Name|Version):'

    - name: Instantiate FastMCP server
      run: |
        python -c "from pyobfus_mcp.server import _build_server; _build_server()"
