name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned 2026-05-09)
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest tests/ -v --cov=pyobfus --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5 (pinned 2026-05-09)
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check code formatting with black
      run: |
        black --check pyobfus/ pyobfus_pro/ pyobfus_mcp/pyobfus_mcp/ tests/ integration_tests/ benchmarks/llm_resistance/

    - name: Lint with ruff
      run: |
        ruff check pyobfus/ pyobfus_pro/ pyobfus_mcp/pyobfus_mcp/ tests/ integration_tests/ benchmarks/llm_resistance/

    - name: Type check with mypy
      run: |
        # Check every shipped source package explicitly. Tests remain covered by
        # runtime pytest and lint; they are not part of the public typed surface.
        mypy pyobfus/ pyobfus_pro/ pyobfus_mcp/pyobfus_mcp/

    - name: Validate discovery metadata
      run: |
        python -m json.tool docs/.well-known/ai-catalog.json > /dev/null

  mcp-tests:
    # The MCP package has its own pytest root (AGENTS.md documents three roots).
    # Before 2026-07-19 CI only *instantiated* the server (see mcp-sdk-latest
    # below) and never ran pyobfus_mcp/tests/, so 73 tests were unenforced.
    name: MCP Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install -e ./pyobfus_mcp

    - name: Run MCP test suite
      run: |
        pytest pyobfus_mcp/tests/ -v --no-cov

  integration:
    # Drives the installed CLI as a subprocess and executes the obfuscated
    # output. Was a set of inline `run:` smoke steps until 2026-07-19; the
    # integration_tests/ directory existed but was empty, so the documented
    # `pytest integration_tests/` root collected zero tests.
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run end-to-end test suite
      run: |
        pytest integration_tests/ -v --no-cov

  benchmark-smoke:
    # Offline, deterministic validation of the P2-18 corpus -> obfuscate ->
    # recover -> functional-score -> report pipeline. Real model measurements
    # remain credentialed/manual; stub output is never published as evidence.
    name: LLM resistance benchmark smoke test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run offline benchmark smoke suite
      run: |
        pytest benchmarks/llm_resistance/test_smoke.py -v --no-cov

  mcp-sdk-latest:
    # Catches mcp SDK API drift against pyobfus-mcp (e.g. the FastMCP version=
    # kwarg removal that shipped silently in mcp 1.20+ and forced the 0.1.2
    # emergency release on 2026-05-07). Pins the floor at the version we
    # currently require; CI fails the day a future floor breaks _build_server().
    name: pyobfus-mcp build smoke test (latest mcp SDK)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python 3.13
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install pyobfus-mcp + latest mcp SDK
      run: |
        python -m pip install --upgrade pip
        pip install -e ./pyobfus_mcp 'mcp>=1.20'
        pip show mcp | grep -E '^(Name|Version):'

    - name: Instantiate FastMCP server
      run: |
        python -c "from pyobfus_mcp.server import _build_server; _build_server()"
