name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Merges made by Dependabot auto-merge are pushed with GITHUB_TOKEN, which
  # does not trigger push workflows, so main could go untested between human
  # pushes. A daily run catches that.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Least privilege: these jobs only read the checkout. No job here publishes,
# writes releases, or needs OIDC (that lives in release.yml). OSPS-AC-04.01.
permissions:
  contents: read

# Only pull requests share a group: a newer push to a PR cancels the older run.
# Every other event gets its own group (run_id), because GitHub also drops a
# *pending* run when a newer one queues in the same group, even with
# cancel-in-progress false -- that would leave some main commits untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.paths.outputs.code }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)
      with:
        fetch-depth: 0
    - name: Classify changed paths (fail open)
      id: paths
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        code=true
        if [[ "$EVENT" == pull_request ]]; then
          base="$BASE"
        elif [[ "$EVENT" == push ]]; then
          base="$BEFORE"
        else
          base=""
        fi
        if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
          if git diff --name-only --no-renames -z "$base" "$HEAD" > "$RUNNER_TEMP/changed-paths"; then
            if output=$(python scripts/ci_changed_paths.py < "$RUNNER_TEMP/changed-paths"); then
              if [[ "$output" == code=false ]]; then code=false; fi
            fi
          fi
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Select core test matrix
      id: matrix
      env:
        EVENT: ${{ github.event_name }}
      run: echo "matrix=$(python scripts/ci_changed_paths.py --matrix "$EVENT")" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (pinned 2026-05-09)
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ./pyobfus_runtime
        pip install -e ".[dev]"

    - name: Run tests
      env:
        # One cell prints the coverage table to the job log. There is no external
        # upload: Codecov never accepted a tokenless push upload and nobody read it
        # (removed 2026-10-21).
        COLLECT_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' }}
      shell: bash
      run: |
        if [[ "$COLLECT_COVERAGE" == true ]]; then
          pytest tests/ -n auto -q -ra --durations=15 -o addopts='' --cov=pyobfus --cov-report=term
        else
          pytest tests/ -n auto -q -ra -o addopts='' --durations=15 --no-cov
        fi
        pytest pyobfus_runtime/tests/ -q -ra -o addopts='' --no-cov

  crossfile-opacity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: L3 delivery (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.15']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install builder and independent public runtime
      shell: bash
      run: |
        python -m pip install -e ".[dev]"
        python -m venv "$RUNNER_TEMP/l3-runtime"
        if [[ "$RUNNER_OS" == Windows ]]; then
          runtime_python="$RUNNER_TEMP/l3-runtime/Scripts/python.exe"
        else
          runtime_python="$RUNNER_TEMP/l3-runtime/bin/python"
        fi
        "$runtime_python" -m pip install 'pyobfus-runtime==0.1.1'
        "$runtime_python" -m pip check
        echo "PYOBFUS_L3_RUNTIME_PYTHON=$runtime_python" >> "$GITHUB_ENV"
    - name: Verify real builds, private publication and runtime-only execution
      shell: bash
      run: |
        python -m pytest tests/test_crossfile_opacity_build.py tests/test_crossfile_opacity_adapter.py tests/test_crossfile_opacity_debug.py tests/test_crossfile_opacity_plan.py -q -o addopts='' --no-cov

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ./pyobfus_runtime
        pip install -e ".[dev]"

    # black, ruff, mypy and the discovery-metadata check. The paths live only
    # in scripts/check.sh, which contributors and the pre-push hook run too, so
    # the local and CI lists cannot drift apart again.
    - name: Black, ruff, mypy, metadata (scripts/check.sh lint)
      run: scripts/check.sh lint

  mcp-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The MCP package has its own pytest root (AGENTS.md documents four pytest roots).
    # Before 2026-07-19 CI only *instantiated* the server (see mcp-sdk-latest
    # below) and never ran pyobfus_mcp/tests/, so 73 tests were unenforced.
    name: MCP Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ['3.11', '3.15']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (pinned 2026-05-09)
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ./pyobfus_runtime
        pip install -e ".[dev]"
        pip install -e ./pyobfus_mcp

    - name: Run MCP test suite
      run: |
        pytest pyobfus_mcp/tests/ -q -ra -o addopts='' --no-cov

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Drives the installed CLI as a subprocess and executes the obfuscated
    # output. Was a set of inline `run:` smoke steps until 2026-07-19; the
    # integration_tests/ directory existed but was empty, so the documented
    # `pytest integration_tests/` root collected zero tests.
    name: Integration Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.15']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (pinned 2026-05-09)
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e ./pyobfus_runtime
        pip install -e ".[dev]"

    - name: Run end-to-end test suite
      run: |
        pytest integration_tests/ -n auto -q -ra -o addopts='' --no-cov

  runtime-wheel:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Redistributable runtime wheel boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ['3.12', '3.15']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)
      with:
        fetch-depth: 0  # runtime-v* tags for the version guard

    - name: Runtime source must not change without a version bump
      run: python scripts/check_runtime_version.py

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (pinned 2026-05-09)
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Build and inspect the standalone wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel pyobfus_runtime
        python -c "import glob, zipfile; wheel=glob.glob('pyobfus_runtime/dist/*.whl')[0]; names=zipfile.ZipFile(wheel).namelist(); forbidden=('pyobfus_pro', 'transformers/', 'license.py', 'cli.py'); assert not any(any(item in name for item in forbidden) for name in names), names"

    - name: Install only the runtime wheel and test its boundary
      run: |
        pip install pytest pytest-cov pyobfus_runtime/dist/*.whl
        pytest pyobfus_runtime/tests/ -q -ra -o addopts='' --no-cov

  benchmark-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Offline, deterministic validation of the P2-18 corpus -> obfuscate ->
    # recover -> functional-score -> report pipeline. Real model measurements
    # remain credentialed/manual; stub output is never published as evidence.
    name: LLM resistance benchmark smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e ./pyobfus_runtime
        pip install -e ".[dev]"

    - name: Run offline benchmark smoke suite
      run: |
        pytest benchmarks/llm_resistance/test_smoke.py benchmarks/llm_resistance/test_key_exposure.py -q -ra -o addopts='' --no-cov

  mcp-sdk-latest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Catches mcp SDK API drift against pyobfus-mcp (e.g. the FastMCP version=
    # kwarg removal that shipped silently in mcp 1.20+ and forced the 0.1.2
    # emergency release on 2026-05-07). Pins the floor at the version we
    # currently require; CI fails the day a future floor breaks _build_server().
    #
    # This job tests the 1.x line only: pyobfus-mcp caps `mcp<2.0.0`, so the
    # resolver pulls the newest 1.x no matter how high the floor here is. The
    # 2.x line is exercised by the separate job below, which installs over the
    # cap on purpose. Before 2026-09-12 this job was named "latest mcp SDK",
    # which read as though it covered 2.x — it never did.
    name: pyobfus-mcp build smoke test (mcp SDK 1.x)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install pyobfus-mcp + newest 1.x mcp SDK
      run: |
        python -m pip install --upgrade pip
        # Install both packages from this checkout so a release-candidate MCP
        # dependency floor can be tested before that Core version reaches PyPI.
        pip install -e ./pyobfus_runtime -e . -e ./pyobfus_mcp 'mcp>=1.20'
        pip show mcp | grep -E '^(Name|Version):'

    - name: Instantiate FastMCP server
      run: |
        python -c "from pyobfus_mcp.server import _build_server; _build_server()"

  mcp-sdk-2x:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Production still caps SDK <2. This private wheel changes only that cap;
    # the clean target must resolve normally, pass pip check, then exercise all
    # nine tools against public Core rather than source-shadowing the checkout.
    name: MCP SDK 2 candidate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.15']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Resolve candidate wheel with public Core and SDK 2
      shell: bash
      run: |
        python -m pip install build
        python scripts/build_mcp_sdk2_candidate.py "$RUNNER_TEMP/mcp2-candidate"
        python -m venv "$RUNNER_TEMP/sdk2-target"
        if [[ "$RUNNER_OS" == Windows ]]; then
          candidate_python="$RUNNER_TEMP/sdk2-target/Scripts/python.exe"
        else
          candidate_python="$RUNNER_TEMP/sdk2-target/bin/python"
        fi
        "$candidate_python" -m pip install 'pyobfus==0.9.1' 'mcp>=2,<3' pytest "$RUNNER_TEMP/mcp2-candidate/dist/"*.whl
        "$candidate_python" -m pip check
        echo "PYOBFUS_MCP2_PYTHON=$candidate_python" >> "$GITHUB_ENV"
    - name: Full MCP tests and real legacy/auto stdio contracts
      shell: bash
      run: |
        "$PYOBFUS_MCP2_PYTHON" -I -m pytest -c pyobfus_mcp/pyproject.toml pyobfus_mcp/tests/ --import-mode=importlib -q
        "$PYOBFUS_MCP2_PYTHON" -I scripts/validate_mcp_sdk2.py

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5 (pinned 2026-05-09 for Socket supply-chain score)

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v5 (pinned 2026-05-09)
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: docs/requirements.txt

    - name: Install docs dependencies
      run: pip install -r docs/requirements.txt

    # README links must survive PyPI rendering (46 once shipped as 404s), and
    # mkdocs --strict turns link warnings into failures. Both live in
    # scripts/check.sh so a local run checks exactly what CI checks.
    - name: README links + mkdocs --strict (scripts/check.sh docs)
      run: scripts/check.sh docs

  result:
    name: CI result
    needs: [changes, test, crossfile-opacity, lint, mcp-tests, integration, runtime-wheel, benchmark-smoke, mcp-sdk-latest, mcp-sdk-2x, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check all job results
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
