name = "pyobfus-license-server"
main = "src/worker.js"
compatibility_date = "2025-11-12"

# Public identifier of the active CI issuer key. The private JWK is the
# CI_SIGNING_PRIVATE_JWK secret and is never committed.
[vars]
CI_SIGNING_KEY_ID = "ci-2026-11"

# KV Namespace Binding
[[kv_namespaces]]
binding = "LICENSES"
id = "61072fc72c35405c850427da381ccdbf"

# CI requests per licence, using hashed keys.
[[ratelimits]]
name = "CI_RATE_LIMITER"
namespace_id = "2101"
[ratelimits.simple]
limit = 30
period = 60

# CI requests per client IP, before licence KV lookup.
[[ratelimits]]
name = "CI_IP_RATE_LIMITER"
namespace_id = "2102"
[ratelimits.simple]
limit = 60
period = 60
