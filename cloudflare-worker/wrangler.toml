name = "pyobfus-license-server"
main = "src/worker.js"
compatibility_date = "2025-11-12"

# Public identifier of the active CI issuer key. The private JWK is the
# CI_SIGNING_PRIVATE_JWK secret and is never committed.
[vars]
CI_SIGNING_KEY_ID = "ci-2026-11"

# KV Namespace Binding
[[kv_namespaces]]
binding = "LICENSES"
id = "61072fc72c35405c850427da381ccdbf"
