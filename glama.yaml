version: 1

server:
  name: pyobfus-mcp
  description: >-
    Official MCP server for the pyobfus Python obfuscator. Seven tools:
    pre-flight risk scan, zero-config init, reverse stack-trace mapping,
    list presets, explain preset, recommend tier, and start Pro trial.
    Built for AI-assisted Python development workflows in Claude Desktop,
    Claude Code, Cursor, Windsurf, and Zed.

startCommand:
  type: stdio
  command: pyobfus-mcp

build:
  dockerfile: pyobfus_mcp/Dockerfile
