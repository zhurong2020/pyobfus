site_name: pyobfus Documentation
site_url: https://pyobfus.readthedocs.io
site_description: AST-based Python obfuscator with reverse stack-trace mapping for debuggable, local-first code protection before customer delivery.

# MkDocs excludes dot-directories by default. ARD requires this exact
# well-known path, so opt it back into the generated site.
exclude_docs: |
  !/.well-known/
  # Maintainer-only material. The directory is gitignored, so Read the Docs
  # never saw most of it, but one archived file predates that rule and was
  # being published. Excluding the directory makes a local build match what
  # actually ships, instead of relying on the ignore rule to do two jobs.
  internal/
  # Agent-facing history moved out of CLAUDE.md; maintainer-only.
  CLAUDE_MD_HISTORY.md
  # Implementation/review evidence belongs to maintainers, not the product site.
  CROSSFILE_LOCAL_NAMES_REVIEW.md
  # Unimplemented proposal; reviewed in GitHub before product documentation.
  CROSSFILE_PARAMETER_RENAMING_DESIGN.md

repo_name: zhurong2020/pyobfus
repo_url: https://github.com/zhurong2020/pyobfus

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

# Navigation is organised by what a reader came to do, not by which files
# happen to exist. Internal planning documents (TODO, the Chinese current-plan
# file, dated feature/distribution research, the SDK spike, the next-feature
# decision) are deliberately NOT listed: they are working notes for maintainers
# and reading as a public product page's table of contents made the project
# look like a scratchpad. The files stay in the repository and their built URLs
# still resolve, so nothing that ever linked to them breaks.
nav:
  - Home: index.md
  - Getting started:
    - 简体中文概览: https://github.com/zhurong2020/pyobfus/blob/main/README.zh-CN.md
    - How to cite: CITATION.md
    - License activation: LICENSE_ACTIVATION_GUIDE.md
    - Project structure: PROJECT_STRUCTURE.md
    - Community / Pro boundary: EDITION_BOUNDARY_POLICY.md
    - Share a usage report: case-studies/README.md
  - Guides:
    - Protect Python before selling: guides/protect-python-before-selling.md
    - Debug an obfuscated traceback: guides/debug-obfuscated-python.md
  - Compare:
    - Overview: COMPARISON.md
    - vs PyArmor: compare/pyarmor.md
    - vs Nuitka: compare/nuitka.md
    - vs Cython: compare/cython.md
    - vs PyLocket: compare/pylocket.md
    - vs Oxyry: compare/oxyry.md
    - vs browser-based obfuscators: compare/browser-based.md
    - Other tools: compare/other-tools.md
    - What is tested, what is assumed: SUPPORT_MATRIX.md
    - LLM resistance benchmark: LLM_RESISTANCE_BENCHMARK.md
  - Cookbooks:
    - Selective opacity config: OPACITY_CONFIG.md
    - PyInstaller: PYINSTALLER_COOKBOOK.md
    - Nuitka / Cython: COMPILED_PACKAGING_COOKBOOK.md
    - Integration testing: INTEGRATION_TESTING.md
    - Remote-debug hardening (Python 3.14): REMOTE_DEBUG_HARDENING.md
    - Python 3.8 compatibility (historical): PYTHON38_COMPATIBILITY.md
  - Verifying a build:
    - Verifiable build report: VERIFIABLE_BUILD_REPORT.md
    - Provenance manifest: PROVENANCE_MANIFEST.md
    - SARIF code scanning: SARIF_CODE_SCANNING.md
    - Threat model: THREAT_MODEL.md
    - Supply-chain assurance (SLSA / CycloneDX / PEP 740): SUPPLY_CHAIN_ASSURANCE.md
    - Reason codes: REASON_CODES.md
  - Distribution:
    - Open VSX publishing: OPEN_VSX_PUBLISH_PLAN.md
    - Affiliate pilot design (not launched): AFFILIATE_PROGRAM_DESIGN.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
