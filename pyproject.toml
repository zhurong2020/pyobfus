[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyobfus"
version = "0.4.0"
description = "pyobfus — the Python obfuscator. AST-based python-obfuscator / code-obfuscator with framework-aware presets (FastAPI, Django, Pydantic, Click, SQLAlchemy), reverse stack-trace mapping for AI-assisted debugging, and JSON CLI for Claude Code, Cursor, and MCP agents. Modern PyArmor alternative, Apache-2.0."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Rong Zhu", email = "zhurong0525@gmail.com"}
]
maintainers = [
    {name = "Rong Zhu", email = "zhurong0525@gmail.com"}
]
keywords = [
    "obfuscation", "code-protection", "security", "python", "ast",
    "code-obfuscator", "python-obfuscator", "py-obfuscator", "pyobfuscator",
    "name-mangling", "string-encryption", "anti-debug", "control-flow-flattening",
    "pyarmor-alternative", "source-protection", "license-management",
    "python3.14", "python3.13", "python3.12", "python3.11",
    "fastapi", "django", "flask", "pydantic", "click", "sqlalchemy",
    "llm-tools", "mcp", "mcp-server", "claude-code", "cursor",
    "ai-native", "ai-friendly", "vibe-coding",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.0",
    "pyyaml>=5.4",
    'astunparse>=1.6.3; python_version<"3.9"',  # Required for Python 3.8 code generation
    "cryptography>=41.0",  # Required for Pro features (AES-256 encryption) and license management
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/zhurong2020/pyobfus"
Documentation = "https://pyobfus.readthedocs.io/"
Repository = "https://github.com/zhurong2020/pyobfus"
"Source Code" = "https://github.com/zhurong2020/pyobfus"
"Bug Tracker" = "https://github.com/zhurong2020/pyobfus/issues"
"Changelog" = "https://github.com/zhurong2020/pyobfus/blob/main/CHANGELOG.md"
"Discussions" = "https://github.com/zhurong2020/pyobfus/discussions"
"Funding" = "https://www.buymeacoffee.com/zhurong052Q"
"AI Integration Guide" = "https://github.com/zhurong2020/pyobfus/blob/main/docs/AI_INTEGRATION_STRATEGY.md"
"Roadmap" = "https://github.com/zhurong2020/pyobfus/blob/main/docs/ROADMAP.md"

[project.scripts]
pyobfus = "pyobfus.cli:main"
pyobfus-trial = "pyobfus.trial_cli:cli"
pyobfus-license = "pyobfus_pro.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyobfus*"]
# Exclude sibling packages that are distributed separately (e.g. pyobfus_mcp)
exclude = ["tests*", "docs*", "examples*", "pyobfus_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Exclude Pro features tests (requires pyobfus_pro which is not in public repo)
addopts = "-v --cov=pyobfus --cov-report=term-missing --cov-report=html --ignore=tests/test_pro_features.py"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py38"
