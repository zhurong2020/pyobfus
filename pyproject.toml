[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyobfus"
version = "0.5.6"
description = "pyobfus — the Python obfuscator. AST-based name mangling + framework presets (FastAPI/Django/Pydantic/Click/SQLAlchemy) + reverse stack-trace mapping for AI debugging in Claude Code / Cursor. A transparent PyArmor alternative: AST-level protection with debuggable traces. Apache-2.0."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Rong Zhu", email = "zhurong0525@gmail.com"}
]
maintainers = [
    {name = "Rong Zhu", email = "zhurong0525@gmail.com"}
]
keywords = [
    "obfuscation", "code-protection", "security", "python", "ast",
    "code-obfuscator", "python-obfuscator", "py-obfuscator", "pyobfuscator",
    "name-mangling", "string-encryption", "anti-debug", "control-flow-flattening",
    "pyarmor-alternative", "source-protection", "license-management",
    "python3.14", "python3.13", "python3.12", "python3.11",
    "fastapi", "django", "flask", "pydantic", "click", "sqlalchemy",
    "llm-tools", "mcp", "mcp-server", "claude-code", "cursor",
    "ai-native", "ai-friendly", "vibe-coding",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.0",
    "pyyaml>=5.4",
    "cryptography>=42.0",  # AES-256-GCM / RSA-OAEP / PBKDF2 for Pro features + license management
    'tomli>=2.0; python_version<"3.11"',  # opacity-config TOML parser (tomllib is stdlib on 3.11+)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    # mypy 2.x no longer accepts python_version=3.9, while mypy 1.20+ itself
    # requires Python 3.10. Allow 1.19.x on the Python 3.9 runtime jobs.
    "mypy>=1.19,<2.0",
    "types-PyYAML>=6.0",
    # CI runs on 3.11+ but mypy targets 3.9, where config validation imports
    # the tomllib backport.
    "tomli>=2.0",
    # No [tool.ruff.lint] select in this file, so ruff lints with its
    # version's default rule set. 0.16 expanded that default set (RUF100,
    # TRY004, PERF102, import-sort, ...) and surfaced 774 findings across
    # already-shipped code with zero source changes (2026-08-01 CI break on
    # commit defc5d2). Cap below that until the codebase is deliberately
    # brought up to the new defaults (or a select= list pins the rule set
    # explicitly so upgrades stop being silent).
    "ruff>=0.1.0,<0.16",
]

[project.urls]
Homepage = "https://github.com/zhurong2020/pyobfus"
Documentation = "https://pyobfus.readthedocs.io/"
Repository = "https://github.com/zhurong2020/pyobfus"
"Source Code" = "https://github.com/zhurong2020/pyobfus"
"Bug Tracker" = "https://github.com/zhurong2020/pyobfus/issues"
"Changelog" = "https://github.com/zhurong2020/pyobfus/blob/main/CHANGELOG.md"
"Discussions" = "https://github.com/zhurong2020/pyobfus/discussions"
"Funding" = "https://www.buymeacoffee.com/zhurong052Q"
"Citation" = "https://doi.org/10.5281/zenodo.20846053"
"AI Integration Guide" = "https://github.com/zhurong2020/pyobfus/blob/main/docs/AI_INTEGRATION_STRATEGY.md"
"Roadmap" = "https://github.com/zhurong2020/pyobfus/blob/main/docs/ROADMAP.md"

[project.scripts]
pyobfus = "pyobfus.cli:main"
pyobfus-trial = "pyobfus.trial_cli:cli"
pyobfus-license = "pyobfus_pro.cli:cli"
pyobfus-unscrub = "pyobfus_pro.unscrub:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyobfus*"]
# Exclude sibling packages that are distributed separately (e.g. pyobfus_mcp)
exclude = ["tests*", "docs*", "examples*", "pyobfus_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=pyobfus --cov-report=term-missing --cov-report=html"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py39"
